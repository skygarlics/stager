<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIDX Leveler</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <div class="login-icon">🔒</div>
            <h2 id="login-title">IIDX Leveler</h2>
            <p class="login-desc">パスワードを入力してアクセスしてください</p>
            <input type="password" id="password-input" placeholder="Password" autocomplete="off" />
            <button id="login-btn" class="btn-primary">UNLOCK</button>
            <p id="login-error" class="error hidden"></p>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="modal hidden">
        <div class="modal-content">
            <div class="spinner"></div>
            <p>データ読み込み中...</p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <header>
            <nav id="route-tabs" class="route-tabs" aria-label="Page routes">
                <a href="#iidx" id="route-iidx" class="route-tab">IIDX</a>
                <a href="#drum" id="route-drum" class="route-tab">Drum</a>
            </nav>
            <div id="status-bar">
                <span id="current-level" class="level-badge">F</span>
                <button id="game-mode-toggle" class="game-mode-badge" title="SP/DP">SP</button>
                <button id="env-toggle" class="env-badge" title="家用環境へ切替">家用</button>
                <button id="mode-toggle" class="mode-badge" title="ゲージモード切替">ノマゲ</button>
                <button id="sp-refresh-btn" class="dp-refresh-btn hidden" title="難易度表を更新">更新</button>
                 <div id="dp-controls" class="hidden">
                     <button id="dp-offi-down" class="dp-offi-btn">◀</button>
                     <span id="dp-offi-label" class="dp-offi-label">☆11</span>
                     <button id="dp-offi-up" class="dp-offi-btn">▶</button>
                     <button id="dp-refresh-btn" class="dp-refresh-btn" title="難易度表を更新">更新</button>
                 </div>
                <span id="song-count" class="count-badge">0 / 0</span>
            </div>
        </header>

        <main>
            <section id="iidx-section" class="route-section">
                <!-- Song Card -->
                <div id="song-card">
                    <div id="song-version" class="song-meta"></div>
                    <div id="song-name" class="song-title">Loading...</div>
                    <div id="song-level" class="song-meta"></div>
                </div>

                <!-- Action Buttons -->
                <div id="action-buttons">
                    <button id="fail-btn" class="action-btn fail" disabled>
                        <span class="btn-icon">✕</span>
                        <span class="btn-label">FAIL</span>
                    </button>
                    <button id="clear-btn" class="action-btn clear" disabled>
                        <span class="btn-icon">○</span>
                        <span class="btn-label">CLEAR</span>
                    </button>
                </div>

                <!-- History Panel -->
                <div id="history-panel">
                    <div class="panel-header">
                        <h3>Play History</h3>
                        <button id="history-toggle" class="btn-icon-only">▼</button>
                    </div>
                    <ul id="history-list"></ul>
                </div>
            </section>

            <section id="drum-section" class="route-section hidden">
                <div class="drum-page-head">
                    <div>
                        <h2>DrumTower</h2>
                        <p id="drum-summary" class="drum-summary">CSV data loading...</p>
                    </div>
                    <div id="drum-summary-stats" class="drum-summary-stats"></div>
                </div>
                <div id="drum-floor-list" class="drum-floor-list"></div>
            </section>
        </main>

        <footer>
        </footer>
    </div>

    <script src="common.js"></script>
    <script src="sp.js"></script>
    <script src="dp.js"></script>
    <script src="drum.js"></script>
    <script src="app.js"></script>
</body>
</html>
